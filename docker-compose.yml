version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: voc-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: voc_system
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - voc-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voc-backend
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: voc_system
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    networks:
      - voc-network
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voc-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - voc-network

volumes:
  mongodb_data:

networks:
  voc-network:
    driver: bridge
